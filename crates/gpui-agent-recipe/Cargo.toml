[package]
name = "gpui-agent-recipe"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Experimental recipes, TMP-inspired schema mapping, and receipts for gpui-agent."

[features]
# Opt-in on this crate — never in its `default` (gpui-agent-cli turns it
# on in its own default build). Other consumers get the original keyword
# scorer byte-for-byte. `instinct` switches `resolve_intent` to
# the Instinct-backed evidence/arbitration resolver (gpui-agent-policy:
# deterministic, local, no model, no network).
instinct = ["dep:gpui-agent-policy"]

[dependencies]
gpui-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex-lite = "0.1"

# Optional: Instinct-backed policy (M2). Pulled only by the `instinct` feature.
gpui-agent-policy = { workspace = true, optional = true }

[dev-dependencies]
todo-core.workspace = true
criterion = "0.5"

[[bench]]
name = "recipe_plan"
harness = false

[lints]
workspace = true
